<script>
const STEP_HTML = "<div style=\"height: 52px; padding: 0 18px 0 6px; border-radius: 26px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(11,37,69,.22); animation: pop 0.78s ease both;\">\n<span class=\"disp\" style=\"width: 40px; height: 40px; border-radius: 20px; background: #5DB645; color: #0B2545; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;\">{{st.n}}</span>\n<span style=\"font-size: 15px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;\">Part {{st.n}} of 7</span>\n</div>";
const SUB_OPEN = "<div style=\"position: absolute; left: 48px; right: 48px; top: 0; height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; line-height: 1.3; font-weight: 700; color: #F4F7FB; animation: up 0.7s ease both;\">";
function fit(){ const s = Math.min(window.innerWidth / 1280, window.innerHeight / 870); document.getElementById('fit').style.transform = 'scale(' + s + ')'; }
window.addEventListener('resize', fit); fit();
class Player {
  constructor() {
    this.state = { scene: 0, el: 0, playing: false, started: false, ended: false, music: true, subsOn: true };
    this.ctx = null;
  }
  durs() { return [26000, 74000, 42000, 58000, 50000, 58000, 50000, 100000]; }
  subLines() {
    return [[[0, "Welcome! This video shows how to handle outage cases that come to Support from PE."], [5000, "A PE makes Support aware of an outage, on the origin or translated site, through a case that needs urgent customer coordination."], [9000, "Outages are time-critical, and depend on the customer taking action quickly."], [13000, "You own it. You follow up with the Emergency POCs, and drive the customer response the PE needs."], [19000, "Outage cases are always Critical, and can only be closed once everything is resolved."]],
      [[0, "Part 1: which procedure do you follow?"], [3000, "First, is this a Tier 1 customer? That means the account carries the 24/7 Entitlement in Salesforce."], [9000, "If yes, check who's at fault."], [13000, "Tier 1, and MotionPoint at fault: follow the full P1 procedure."], [21000, "Tier 1, but the customer is at fault: no P1 procedure. Make the customer aware, and follow up every 2 hours until it's resolved."], [32000, "Not Tier 1: work it as a Critical case, without the P1 chat."], [34000, "Notify the Emergency POCs, and follow up every 2 hours until the customer responds."], [40000, "Act on whatever the PE needs the customer to do."], [44000, "If the customer is at fault, follow up until it's resolved."], [47000, "If MotionPoint is at fault, keep the customer updated as PE shares news."], [56000, "Two more rules."], [57000, "If the outage case came from the customer instead of PE, follow the same logic, Tier 1 or not."], [63000, "And if an outage case came in as Standard, change its priority to Critical, and move the due date to the same day."], [69000, "Every outage case is Critical."]],
      [[0, "Part 2: what counts as a P1 event?"], [2000, "The site is down, the home page displays blank, or the checkout flow is broken."], [9000, "Customers can't add items to the cart, or the login page is blank or inaccessible."], [14000, "The home page displays broken, or the main logo is broken."], [19000, "Latency or performance problems."], [21500, "The translated site redirects to the origin, or loads in English."], [28000, "A P1 event, a Tier 1 customer, and MotionPoint at fault means the full P1 procedure."], [34000, "Speed and communication matter most, but the paperwork still has to happen."]],
      [[0, "Part 3: notify the Emergency POCs. This applies to every outage case."], [4000, "The PE creates the case with the URLs, languages, timing, and whose issue it is."], [7500, "The priority is always Critical, and Omnichannel assigns it to you. You're the case owner."], [22000, "Open the customer's Business Entity, and click Related Contacts."], [27000, "Notify every contact checked as Emergency Contact."], [40000, "Email them the details: the site, the languages, since when, and what's broken."], [45000, "And say exactly what you need them to do."], [50000, "It's a Critical case, so move the due date to the next day as needed."]],
      [[0, "Part 4: the P1 Teams chat. Only for Tier 1 customers, when MotionPoint is at fault."], [5500, "Open a Teams chat, label it P1, and put the case number in the title."], [8000, "Add the PE involved, the Account CXM, and the P1 escalation list."], [11000, "Then link the Salesforce case in the chat, so everyone can reach it quickly."], [26000, "Keep the chat updated throughout. Post every development."], [31000, "Keep PE activity in the chat, not in side conversations."], [34000, "That way all MotionPointers stay in sync until the outage is resolved."]],
      [[0, "Part 5: follow up, and act."], [4000, "Follow up every 2 hours until the customer responds. Tier 1 or not."], [11000, "Use posts, emails and phone calls."], [22000, "Act on whatever the PE instructs the customer to do: whitelist our IPs, confirm the origin site is up, whitelist a user agent, and so on."], [29000, "If the customer is at fault, follow up until it's resolved."], [32000, "If MotionPoint is at fault, keep the customer updated as PE shares information."], [40000, "What comes back? If they're talking internally, the status stays Pending. Follow up every day until it's resolved."], [44500, "If they want more detail, and it's technical, arrange a call with PE."], [47000, "If the site is still down after a month, confirm with the CXM how to proceed, before setting the case to Closed."], [52000, "You can suggest pointing the translated site to the origin, but let the CXM decide."]],
      [[0, "Part 6: resolve and close."], [4000, "Once it's resolved, tell everyone in the P1 chat, and document the case."], [9000, "Then send it to Platform Ops. They set up monitoring alerts and close the case."], [12000, "An outage case can only be closed once everything is resolved."], [15000, "Until then, keep following up, and move the due date to the next day as needed. All outage cases are Critical."], [26000, "If the customer asks for a non-formal RCA, a root cause analysis, the case goes to the PE lead to add the RCA. You share it with the customer, and close the case."], [33000, "If they ask for a formal incident report, check with the PE leads whether it can be generated with Claude."], [38000, "Once it's generated and reviewed, Support or the CXM shares it with the customer, and sets the case to Closed."]],
      [[0, "Part 7: practice. What would you do?"], [4000, "A Tier 1 customer. The translated site loads in English, and MotionPoint is at fault."], [9000, "Full P1 procedure: notify the Emergency POCs, open the P1 Teams chat, and follow up every 2 hours."], [14000, "A Tier 1 customer, whose origin site is down because of their own server."], [19000, "No P1 procedure. Make the customer aware, and follow up every 2 hours until it's resolved."], [24000, "Not Tier 1, and PE needs the customer to whitelist our IPs."], [29000, "Notify the Emergency POCs, pass on the IP list, and follow up every 2 hours."], [34000, "A customer opens a case: their translated site is down, and it came in as Standard."], [39000, "Same logic as a PE case. Change the priority to Critical, and move the due date to the same day."], [44000, "Two hours after your email, there's no reply."], [49000, "Follow up again, by post, email and phone. Every 2 hours until they respond."], [54000, "The customer says their IT team is working on it."], [59000, "Keep it Pending, and follow up every day until it's resolved."], [64000, "It's resolved, and the customer asks for a formal incident report."], [69000, "Check with the PE leads. After review, Support or the CXM shares it, then closes the case."], [76000, "Recap. Outage cases are always Critical, whether they come from PE or the customer. Notify the Emergency POCs from Related Contacts."], [81000, "Tier 1 and MotionPoint at fault: open the P1 Teams chat, and keep it updated."], [84000, "Follow up every 2 hours, act on the PE's instructions, and keep the customer updated."], [88500, "Once resolved: notify, document, and Platform Ops closes it. Thanks for watching!"]]];
  }
  labels() { return ["Intro", "Procedure", "P1 events", "Notify", "P1 chat", "Follow up", "Resolve", "Practice"]; }

  /* ---------- original background jazz, synthesized live ---------- */
  bars() {
    // [bass walk (MIDI), chord voicing (MIDI)] — ii-V-I in F with turnarounds, 80 bpm swing
    return [
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[41, 45, 48, 49], [57, 60, 64, 67]], // Fmaj9
      [[50, 48, 45, 44], [54, 60, 64, 69]], // D9
      [[43, 46, 50, 47], [58, 62, 65, 69]], // Gm9
      [[48, 46, 43, 40], [58, 62, 64, 69]], // C13
      [[45, 48, 52, 51], [60, 64, 67, 71]], // Am9
      [[50, 48, 45, 44], [54, 60, 64, 69]]  // D9
    ];
  }
  hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  initAudio() {
    if (this.ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.0);
      const noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.ctx = ctx; this.master = master; this.noise = noise;
      this.beat = 0; this.nextT = 0;
      return true;
    } catch (e) { return false; }
  }
  pianoNote(m, t, vel, dur) {
    const c = this.ctx;
    const f = this.hz(m);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(900, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.006);
    g.gain.exponentialRampToValueAtTime(vel * 0.3, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(this.master);
    [[1, 1], [2, 0.28], [3, 0.08]].forEach((h) => {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * h[0];
      const hg = c.createGain(); hg.gain.value = h[1];
      o.connect(hg); hg.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  pianoChord(notes, t, vel, dur) {
    notes.forEach((m, i) => this.pianoNote(m, t + i * 0.018, vel, dur));
  }
  tap(t, vol, dur, freq) {
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  scheduleBeat(i, t) {
    const spb = 60 / 80;
    const sw = spb * 2 / 3;
    const barIx = Math.floor(i / 4) % 8;
    const bar = this.bars()[barIx];
    const b = i % 4;
    this.tap(t, 0.014, 0.25, 7500);
    if (b === 1 || b === 3) {
      this.tap(t + sw, 0.01, 0.18, 7500);
      this.tap(t, 0.012, 0.05, 9500);
    }
    if (b === 0) {
      this.pianoNote(bar[0][0] + 12, t, 0.05, 2.4);
      this.pianoChord(bar[1], t + 0.03, 0.028, 2.2);
    }
    const v = Math.floor(i / 4) % 2;
    if (b === 2 && v === 0) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
    if (b === 1 && v === 1) this.pianoChord(bar[1], t + sw, 0.018, 1.2);
  }
  schedule() {
    const c = this.ctx;
    if (!c || c.state !== 'running' || !this.musicLive) return;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < c.currentTime + 0.3) {
      this.scheduleBeat(this.beat, this.nextT);
      this.beat = (this.beat + 1) % 32;
      this.nextT += 60 / 80;
    }
  }
  musicStart() {
    if (!this.state.music || !this.initAudio()) return;
    const c = this.ctx;
    try { c.resume(); } catch (e) {}
    if (!this.musicLive) {
      this.musicLive = true;
      this.beat = 0;
      this.nextT = c.currentTime + 0.1;
      this.master.gain.cancelScheduledValues(c.currentTime);
      this.master.gain.setValueAtTime(0.0001, c.currentTime);
      this.master.gain.exponentialRampToValueAtTime(0.55, c.currentTime + 1.5);
    }
  }
  musicStop(fade) {
    if (!this.ctx) return;
    const c = this.ctx;
    this.musicLive = false;
    const now = c.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setValueAtTime(Math.max(this.master.gain.value, 0.0001), now);
    this.master.gain.exponentialRampToValueAtTime(0.0001, now + (fade || 0.3));
  }
  musicPause() { if (this.ctx) { try { this.ctx.suspend(); } catch (e) {} } }
  musicResume() { if (this.ctx && this.state.music) { try { this.ctx.resume(); } catch (e) {} } }

  componentDidMount() {
    this.iv = setInterval(() => this.tick(), 200);
    this.au = setInterval(() => this.schedule(), 60);
  }
  componentWillUnmount() {
    clearInterval(this.iv); clearInterval(this.au); clearTimeout(this.to);
    if (this.ctx) { try { this.ctx.close(); } catch (e) {} }
  }
  tick() {
    const s = this.state;
    if (!s.playing || s.scene < 0) return;
    const d = this.durs();
    const el = s.el + 200;
    if (el >= d[s.scene]) {
      if (s.scene < d.length - 1) this.setState({ scene: s.scene + 1, el: 0 });
      else { this.setState({ el: d[s.scene], playing: false, ended: true }); this.musicStop(3); }
    } else {
      this.setState({ el: el });
    }
  }
  go(i, off) {
    off = off || 0;
    clearTimeout(this.to);
    this.musicStart();
    this.musicResume();
    this.setState({ scene: -1, el: 0 });
    this.to = setTimeout(() => {
      this.setState({ scene: i, el: off, started: true, playing: true, ended: false });
      if (off) setTimeout(() => this.sync(off), 60);
    }, 40);
  }
  sync(off) {
    try {
      const st = document.querySelector('.stage');
      if (!st || !st.getAnimations) return;
      st.getAnimations({ subtree: true }).forEach((a) => { try { a.currentTime = off; } catch (e) {} });
    } catch (e) {}
  }
  jump(delta) {
    const d = this.durs();
    const s = this.state;
    const cur = s.scene < 0 ? 0 : s.scene;
    let t = 0;
    for (let i = 0; i < cur; i++) t += d[i];
    t += (s.scene < 0 || !s.started) ? 0 : s.el;
    const total = d.reduce((a, b) => a + b, 0);
    t = Math.max(0, Math.min(t + delta, total - 500));
    let i = 0;
    while (i < d.length - 1 && t >= d[i]) { t -= d[i]; i++; }
    this.go(i, t);
  }
  fmt(ms) {
    const t = Math.floor(ms / 1000);
    const m = Math.floor(t / 60);
    const sec = t % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  renderVals() {
    const s = this.state;
    const d = this.durs();
    const total = d.reduce((a, b) => a + b, 0);
    const cur = s.scene < 0 ? 0 : s.scene;
    let done = 0;
    for (let i = 0; i < cur; i++) done += d[i];
    done += s.scene < 0 ? 0 : s.el;
    const vis = s.started ? s.scene : -2;
    const chapters = this.labels().map((label, i) => ({
      label: label,
      cls: s.started && i === cur ? 'on' : (s.started && i < cur ? 'done' : ''),
      go: () => this.go(i)
    }));
    return {
      s0: vis === 0, s1: vis === 1, s2: vis === 2, s3: vis === 3, s4: vis === 4, s5: vis === 5, s6: vis === 6, s7: vis === 7,
      showCover: !s.started,
      pauseCls: s.playing ? '' : 'paused',
      isPlaying: s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? 'Pause' : (s.ended ? 'Replay' : 'Play'),
      progressW: (Math.min(1, done / total) * 100).toFixed(2) + '%',
      timeLabel: this.fmt(done) + ' / ' + this.fmt(total),
      chapters: chapters,
      steps: [1, 2, 3, 4, 5, 6, 7].map((n) => ({ n: n, on: s.started && s.scene >= 0 && s.scene === n })),
      showSubs: s.subsOn && s.started,
      subs: (() => {
        const L = s.scene >= 0 ? this.subLines()[s.scene] : [];
        let act = -1;
        L.forEach((c, i) => { if (s.el >= c[0]) act = i; });
        return L.map((c, i) => ({ text: c[1], on: i === act }));
      })(),
      subsOn: s.subsOn,
      subsLabel: s.subsOn ? 'Hide captions' : 'Show captions',
      subsColor: s.subsOn ? '#8FD16F' : '#A9B8CC',
      toggleSubs: () => this.setState({ subsOn: !this.state.subsOn }),
      musicOn: s.music,
      musicOff: !s.music,
      musicLabel: s.music ? 'Music on' : 'Music off',
      toggleMusic: () => {
        const on = !this.state.music;
        this.setState({ music: on }, () => {
          if (!on) this.musicStop(0.6);
          else if (this.state.playing) this.musicStart();
        });
      },
      togglePlay: () => {
        if (!this.state.started || this.state.ended) this.go(0);
        else {
          const playing = !this.state.playing;
          if (playing) this.musicResume(); else this.musicPause();
          this.setState({ playing: playing });
        }
      },
      replay: () => this.go(0),
      back10: () => this.jump(-10000),
      fwd10: () => this.jump(10000),
      prev: () => this.go(Math.max(0, cur - 1)),
      next: () => this.go(Math.min(d.length - 1, cur + 1))
    };
  }
}

Player.prototype.setState = function (obj, cb) { Object.assign(this.state, obj); this.render(); if (cb) cb(); };
Player.prototype.render = function () {
  const v = this.renderVals();
  const $ = (id) => document.getElementById(id);
  const s = this.state;
  const vis = s.started ? s.scene : -2;
  if (vis !== this._vis) {
    this._vis = vis;
    const tpl = $('scene-' + vis);
    $('sceneHost').innerHTML = tpl ? tpl.innerHTML : '';
  }
  $('stage').classList.toggle('paused', !s.playing);
  $('cover').hidden = !v.showCover;
  const st = v.steps.find((x) => x.on);
  const stn = st ? st.n : 0;
  if (stn !== this._step) { this._step = stn; $('steps').innerHTML = stn ? STEP_HTML.split('{{st.n}}').join(String(stn)) : ''; }
  const sb = v.showSubs ? v.subs.find((x) => x.on) : null;
  const key = sb ? s.scene + '|' + sb.text : '';
  if (key !== this._sub) {
    this._sub = key;
    $('subs').innerHTML = '';
    if (sb) { const d = document.createElement('div'); d.innerHTML = SUB_OPEN + '</div>'; d.firstChild.textContent = sb.text; $('subs').appendChild(d.firstChild); }
  }
  $('prog').style.width = v.progressW;
  $('timeLabel').textContent = v.timeLabel;
  $('playLabel').textContent = v.playLabel;
  $('playBtn').setAttribute('aria-label', v.playLabel);
  $('icoPause').hidden = !v.isPlaying; $('icoPlay').hidden = v.isPlaying;
  $('musicLabel').textContent = v.musicLabel; $('musicBtn').setAttribute('aria-label', v.musicLabel); $('musicBtn').setAttribute('aria-pressed', String(v.musicOn));
  $('icoMusicOn').hidden = !v.musicOn; $('icoMusicOff').hidden = v.musicOn;
  $('subsBtn').setAttribute('aria-label', v.subsLabel); $('subsBtn').setAttribute('aria-pressed', String(v.subsOn)); $('subsIcon').setAttribute('stroke', v.subsColor);
  const ck = v.chapters.map((c) => c.cls).join(',');
  if (ck !== this._chips) {
    this._chips = ck;
    const host = $('chapters'); host.innerHTML = '';
    v.chapters.forEach((c, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip ' + c.cls; b.textContent = c.label;
      b.addEventListener('click', () => this.go(i)); host.appendChild(b);
    });
  }
};
const P = new Player();
const call = (k) => () => P.renderVals()[k]();
document.getElementById('coverPlay').addEventListener('click', call('togglePlay'));
document.getElementById('playBtn').addEventListener('click', call('togglePlay'));
document.getElementById('replayBtn').addEventListener('click', call('replay'));
document.getElementById('prevBtn').addEventListener('click', call('prev'));
document.getElementById('back10Btn').addEventListener('click', call('back10'));
document.getElementById('fwd10Btn').addEventListener('click', call('fwd10'));
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { e.preventDefault(); call('back10')(); } else if (e.key === 'ArrowRight') { e.preventDefault(); call('fwd10')(); } else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); call('togglePlay')(); } });
document.getElementById('nextBtn').addEventListener('click', call('next'));
document.getElementById('musicBtn').addEventListener('click', call('toggleMusic'));
document.getElementById('subsBtn').addEventListener('click', call('toggleSubs'));
P.render();
P.componentDidMount();

</script>
</body>
